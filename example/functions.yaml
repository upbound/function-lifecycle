---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-lifecycle
  annotations:
    # This tells crossplane render to connect to the function locally.
    render.crossplane.io/runtime: Development
    # Use 127.0.0.1, not the default localhost. On some networks resolving
    # localhost adds about 10 seconds to every render.
    render.crossplane.io/runtime-development-target: 127.0.0.1:9443
spec:
  # This is ignored when using the Development runtime.
  package: xpkg.upbound.io/upbound/function-lifecycle:v0.1.0
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-patch-and-transform
  annotations:
    # Run this one locally too, so render doesn't need Docker. make render
    # starts it for you.
    render.crossplane.io/runtime: Development
    render.crossplane.io/runtime-development-target: 127.0.0.1:9444
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform:v0.11.2
