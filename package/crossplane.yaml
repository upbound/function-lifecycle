---
apiVersion: meta.pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-lifecycle
  annotations:
    meta.crossplane.io/maintainer: Upbound <support@upbound.io>
    meta.crossplane.io/source: github.com/upbound/function-lifecycle
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: A composition function that sets the lifecycle mode of every composed managed resource.
    meta.crossplane.io/readme: |
      This composition function sets spec.managementPolicies on every composed
      managed resource from one lifecycle mode: Full, Provision (never delete),
      ObserveOnly, or Deprovision (delete without reconciling drift).

      The mode comes from the XR's lifecycle.fn.crossplane.io/mode annotation,
      from any XR spec or status field or pipeline context key via modeRef, or
      from the function input. Use it to import existing infrastructure, freeze
      changes during an incident, migrate between control planes, or delete an
      XR without deleting its cloud resources.
spec: {}
